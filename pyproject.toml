[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shapefit"
version = "0.1.0"
description = "Fit clean polygons to irregular, noisy shapes with a neural network"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "opencv-python-headless>=4.8",
    "shapely>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[project.scripts]
shapefit-train = "shapefit.train:main"
shapefit-make-dataset = "shapefit.make_dataset:main"

[tool.setuptools]
packages = ["shapefit"]

[tool.setuptools.package-data]
shapefit = ["weights/*.pt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
